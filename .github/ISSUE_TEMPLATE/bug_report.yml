name: Bug report
description: A scene draws wrongly, a key does not work or the terminal is left in a bad state.
labels: ["bug"]
body:
  - type: dropdown
    id: scene
    attributes:
      label: Scene
      multiple: true
      options:
        - sea
        - rain
        - snow
        - starfield
        - code-rain
        - fireflies
        - aurora
        - campfire
        - waves
        - zacess
        - Every scene
        - Not about a scene
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      multiple: true
      options:
        - Zacess Light
        - Zacess Dark
        - Zacess Yellow on Black
        - Zacess Cream
        - Zacess High Contrast Dark
        - Zacess High Contrast Light
        - Zacess Deep Contrast Dark
        - Zacess Deep Contrast Light
        - NO_COLOR
  - type: dropdown
    id: terminal
    attributes:
      label: Terminal
      options:
        - Terminal.app
        - iTerm2
        - kitty
        - Alacritty
        - Ghostty
        - Windows Terminal
        - GNOME Terminal
        - Konsole
        - Warp
        - tmux or screen
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including any error message. A screenshot or a pasted frame helps if you can share one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact command helps most. A headless render with a seed repeats a frame exactly.
      placeholder: |
        1. zacess-scenes sea --theme cream
        2. Resize the window to 20 columns
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and system
      description: The output of `zacess-scenes --version`, the operating system and the terminal version.
      placeholder: zacess-scenes 0.1.0, macOS 26, Ghostty 1.2
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I have read the [Code of Conduct](https://github.com/zacesshq/scenes/blob/main/CODE_OF_CONDUCT.md).
          required: true
