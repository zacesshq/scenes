name: Bug report
description: A scene draws wrongly, a key does not work or the terminal is left in a bad state.
labels: ["bug"]
body:
  - type: dropdown
    id: scene
    attributes:
      label: Scene
      multiple: true
      options:
        - sea
        - rain
        - snow
        - starfield
        - code-rain
        - fireflies
        - aurora
        - campfire
        - waves
        - zacess
        - forest-stream
        - desert-night
        - rooftops
        - lily-pads
        - koi-pond
        - harbour
        - lanterns
        - balloons
        - countryside
        - winter-cabin
        - autumn
        - blossom
        - city-night
        - orbit
        - constellations
        - tea
        - cat-nap
        - garden
        - tiles
        - ribbons
        - sunflower-field
        - mountain-lake
        - tide-pools
        - paper-boats
        - windmills
        - picnic
        - drone-landing
        - kettle-boil
        - rocket-launch
        - pit-stop
        - pcb-bring-up
        - storm
        - flood
        - listing-ship
        - corrosion
        - tangle
        - wilt
        - fog
        - broken-bridge
        - leak
        - blackout
        - traffic-jam
        - erosion
        - drought
        - volcano
        - rockslide
        - dust-storm
        - thin-ice
        - short-circuit
        - overgrown
        - landing-abort
        - kettle-cold
        - launch-scrub
        - pit-stop-stuck
        - dead-led
        - A Lua scene of my own
        - The watch mode
        - Every scene
        - Not about a scene
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      multiple: true
      options:
        - Zacess Light
        - Zacess Dark
        - Zacess Yellow on Black
        - Zacess Cream
        - Zacess High Contrast Dark
        - Zacess High Contrast Light
        - Zacess Deep Contrast Dark
        - Zacess Deep Contrast Light
        - Zacess Warm Dark
        - Zacess Warm Light
        - NO_COLOR
  - type: dropdown
    id: terminal
    attributes:
      label: Terminal
      options:
        - Terminal.app
        - iTerm2
        - kitty
        - Alacritty
        - Ghostty
        - Windows Terminal
        - GNOME Terminal
        - Konsole
        - Warp
        - tmux or screen
        - Other
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you saw, including any error message. A screenshot or a pasted frame helps if you can share one.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The exact command helps most. A headless render with a seed repeats a frame exactly.
      placeholder: |
        1. zacess-scenes sea --theme cream
        2. Resize the window to 20 columns
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and system
      description: The output of `zacess-scenes --version`, the operating system and the terminal version.
      placeholder: zacess-scenes 1.0.0, macOS 26, Ghostty 1.2
  - type: dropdown
    id: ai-use
    attributes:
      label: AI use
      description: "Required. Did AI help you find, test or check this? Write the title and description yourself either way. See the [AI policy](https://github.com/zacesshq/.github/blob/main/AI_POLICY.md). Dictation, translation and spelling tools do not count."
      options:
        - No AI was used
        - "Yes: AI helped me find, test or check it"
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for this problem.
          required: true
        - label: I have read the [Code of Conduct](https://github.com/zacesshq/scenes/blob/main/CODE_OF_CONDUCT.md).
          required: true
