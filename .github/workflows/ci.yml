name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Check the palette table is current
        if: runner.os == 'Linux'
        run: |
          python3 scripts/build-palette.py
          git diff --exit-code src/palette.rs
      - name: Render every scene in every theme without a terminal
        shell: bash
        run: |
          cargo build -q
          bin=target/debug/zacess-scenes
          [ -x "$bin" ] || bin="$bin.exe"
          for scene in $("$bin" --list-scenes | awk '{print $1}'); do
            for theme in $("$bin" --list-themes | awk '{print $1}'); do
              for size in 20x8 120x40; do
                frame=$("$bin" "$scene" --theme "$theme" --headless --frames 30 --size "$size" --seed 1)
                [ -n "$frame" ] || { echo "$scene in $theme at $size drew nothing"; exit 1; }
              done
            done
            echo "::group::$scene at 80x24"
            "$bin" "$scene" --theme deep-dark --headless --frames 30 --size 80x24 --seed 1
            echo "::endgroup::"
          done

  msrv:
    name: Minimum Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # the rust-version in Cargo.toml, so a newer standard library API cannot slip in unseen
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: "1.85"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --locked --all-targets
