# builds a binary for each platform when a version tag is pushed and attaches it to the GitHub
# release for that tag. The release itself is made by a maintainer from a signed tag, so this
# workflow waits for it rather than creating one.
#
# assets are added after the release is published, which only works while immutable releases are
# off for this repository (they are as of the first release). Turning them on means making each
# release as a draft, letting this workflow attach the files, then publishing it.

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    permissions:
      # only to attach the built files to the release of this tag
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Set up the musl cross toolchain
        if: contains(matrix.target, 'musl')
        uses: taiki-e/setup-cross-toolchain-action@12b7ad4acfa95a1476779d6c06699b96ec1691f8 # v1.42.0
        with:
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package the binary with the docs
        id: package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          TAG: ${{ github.ref_name }}
        run: |
          name="zacess-scenes-$TAG-$TARGET"
          mkdir "$name"
          cp README.md LICENSE NOTICE.md CHANGELOG.md ACCESSIBILITY.md "$name/"
          if [[ "$TARGET" == *windows* ]]; then
            cp "target/$TARGET/release/zacess-scenes.exe" "$name/"
            7z a -tzip "$name.zip" "$name" > /dev/null
            asset="$name.zip"
          else
            cp "target/$TARGET/release/zacess-scenes" "$name/"
            tar -czf "$name.tar.gz" "$name"
            asset="$name.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          cat "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"
      - name: Wait for the release of this tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # the maintainer makes the release right after pushing the tag, so this is usually quick
          for attempt in $(seq 1 40); do
            if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
              exit 0
            fi
            echo "No release for $TAG yet (attempt $attempt of 40). Waiting 30 seconds."
            sleep 30
          done
          echo "No release named $TAG exists after 20 minutes. Create it from the tag, then rerun this workflow."
          exit 1
      - name: Attach the files to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          ASSET: ${{ steps.package.outputs.asset }}
        run: gh release upload "$TAG" "$ASSET" "$ASSET.sha256" --repo "$GITHUB_REPOSITORY" --clobber

  notify-site:
    name: Tell the website
    # runs once every platform's files are attached, so the site never reads a half-filled release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Tell the website about the release
        env:
          # an organisation secret: a fine-grained token limited to zacesshq/website with Contents read and write, which is what a repository dispatch needs
          SITE_DISPATCH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          if [ -z "$SITE_DISPATCH_TOKEN" ]; then
            echo "Skipped telling the website: the SITE_DISPATCH_TOKEN secret is not set. Its daily deploy picks up $GITHUB_REF_NAME instead." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # the files are already attached, so a failed dispatch is reported but never fails the run
          if curl -fsS -X POST \
            -H "Authorization: Bearer $SITE_DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/zacesshq/website/dispatches \
            -d "{\"event_type\":\"scenes-release\",\"client_payload\":{\"tag\":\"$GITHUB_REF_NAME\"}}"; then
            echo "Asked zacess.com to rebuild with $GITHUB_REF_NAME." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Could not send the release to zacesshq/website; its daily deploy picks up $GITHUB_REF_NAME instead."
            echo "Could not tell the website about $GITHUB_REF_NAME; its daily deploy picks it up instead." >> "$GITHUB_STEP_SUMMARY"
          fi
