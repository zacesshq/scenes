[package]
name = "zacess-scenes"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Calm animated scenes for the terminal in the Zacess high contrast themes"
license = "MIT"
repository = "https://github.com/zacesshq/scenes"
homepage = "https://zacess.com"
readme = "README.md"
keywords = ["terminal", "animation", "accessibility", "screensaver", "high-contrast"]
categories = ["command-line-utilities", "accessibility"]
exclude = [".github/", "packaging/", "scripts/", "palette/", "docs/images/", "docs/frames/"]

[lib]
name = "zacess_scenes"
path = "src/lib.rs"

[[bin]]
name = "zacess-scenes"
path = "src/main.rs"

[dependencies]
crossterm = "0.29"
# lua 5.4 compiled from source into the binary, so user scenes need nothing installed
mlua = { version = "0.11.6", default-features = false, features = ["lua54", "vendored"] }

[target.'cfg(unix)'.dependencies]
# already a dependency of crossterm on Unix; used directly to restore the terminal on SIGTERM
signal-hook = "0.4"

[profile.release]
lto = true
codegen-units = 1
strip = true
